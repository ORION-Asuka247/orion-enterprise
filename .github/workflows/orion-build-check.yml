name: ORION Release Gates

on:
  push:
    branches: [main, release-hardening-v1]
  pull_request:
    branches: [main]

jobs:
  report-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install weasyprint==70.0 pypdf==6.10.0
      - run: python3 tests/check_report_print.py

  migration-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check migration sequence
        run: python3 scripts/check_migrations.py

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate workflow and launch rules
        run: node --test tests/*.test.mjs
      - name: Build ORION web app
        run: npm run build

  release-static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject browser service-role secrets
        run: |
          if grep -R --line-number --exclude-dir=node_modules --exclude='*.md' 'SUPABASE_SERVICE_ROLE_KEY' apps/web; then
            echo 'Service role key reference found in browser code.'
            exit 1
          fi
      - name: Reject committed environment secrets
        run: |
          if find . -type f \( -name '.env' -o -name '.env.local' -o -name '.env.production' \) -print | grep -q .; then
            echo 'Committed runtime environment file found.'
            exit 1
          fi
      - name: Verify production build configuration exists
        run: test -f netlify.toml && test -f apps/web/vite.config.ts
